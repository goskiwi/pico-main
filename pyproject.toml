[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pico"
version = "0.1.0"
description = "Small auditable coding-agent runtime for OpenAI-compatible Responses models"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.12,<3",
  "tiktoken>=0.11,<1",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-python>=0.25,<0.26",
]

[project.scripts]
pico = "pico.cli:main"
pico-review = "pico.review.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["pico*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "docker: requires the built Pico Docker sandbox image and a running daemon",
]
