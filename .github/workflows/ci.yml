name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check pico applications tests scripts
      - run: uv run python -m compileall -q pico applications tests scripts
      - run: uv run pytest -q
      - name: Run retained Runtime walkthroughs
        if: matrix.python-version == '3.12'
        run: |
          for script in scripts/day[1-7]_*.py; do
            uv run python "$script"
          done

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv build
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/pico-wheel-smoke
          /tmp/pico-wheel-smoke/bin/pip install dist/*.whl
          /tmp/pico-wheel-smoke/bin/pico --help
