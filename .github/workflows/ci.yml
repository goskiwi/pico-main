name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check pico tests scripts
      - run: uv run python -m compileall -q pico tests scripts
      - run: uv run pytest -q
      - name: Run fail-closed Runtime evaluations
        if: matrix.python-version == '3.12'
        run: uv run python scripts/run_evaluations.py

  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: docker build -f docker/sandbox.Dockerfile -t pico/sandbox:latest .
      - name: Verify real Docker containment
        env:
          PICO_RUN_DOCKER_TESTS: "1"
        run: uv run pytest -q tests/test_docker_integration.py

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv build
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/pico-wheel-smoke
          /tmp/pico-wheel-smoke/bin/pip install dist/*.whl
          /tmp/pico-wheel-smoke/bin/pico --help
