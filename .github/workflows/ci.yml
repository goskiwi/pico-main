name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Run lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Build sandbox image
        run: docker build -f Dockerfile.sandbox -t pico-sandbox:latest .

      - name: Verify real Docker boundaries
        env:
          PICO_RUN_DOCKER_TESTS: "1"
        run: uv run pytest -q tests/test_sandbox.py

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify locked dependencies
        run: uv sync --locked

      - name: Build source and wheel distributions
        run: uv build

      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/pico-wheel-smoke
          /tmp/pico-wheel-smoke/bin/pip install dist/*.whl
          /tmp/pico-wheel-smoke/bin/pico --help
