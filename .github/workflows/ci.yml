name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: uv run ruff check pico applications tests benchmarks
      - run: uv run python -m compileall -q pico applications tests benchmarks
      - run: uv run python -m unittest discover -s tests -v

  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: docker build -t pico-sandbox:python docker
      - run: uv run python -m unittest tests.test_docker_sandbox -v
        env:
          PICO_DOCKER_TESTS: '1'
